server {
    listen 80;
    listen 443 ssl http2;
    server_name panel.mcjim-server.com;

    # SSL Certificates (Wildcard)
    ssl_certificate /path/to/your/wildcard.crt;
    ssl_certificate_key /path/to/your/wildcard.key;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirect HTTP to HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location / {
        # Proxy to CyberPanel Admin Port (8090)
        # Note: CyberPanel uses HTTPS by default, so we proxy to https://
        proxy_pass https://10.0.10.51:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ignore self-signed cert issues from CyberPanel's backend
        proxy_ssl_verify off;
    }
}
