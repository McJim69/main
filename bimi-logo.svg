<?xml version="1.0" encoding="utf-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
    <title>McJim Cyberworks BIMI Logo</title>
    
    <!-- Solid dark background for dark-mode stability and high contrast -->
    <rect width="500" height="500" rx="0" fill="#0d1117"/>
    
    
    <g transform="translate(250, 245) scale(1.15)">
        <!-- Top Blue Shard Leaf -->
        <path d="M -10,-100 C -25,-60 -35,-25 -20,5 C -60,-15 -85,-45 -100,-75 C -70,-115 -40,-115 -10,-100 Z" fill="#007acc"/>
        
        <!-- Bottom Right Red Shard Leaf -->
        <path d="M 90,30 C 50,30 10,20 -10,-20 C 15,25 35,60 55,85 C 95,70 105,45 90,30 Z" fill="#d9383a"/>
        
        <!-- Left Orange Shard Leaf -->
        <path d="M -80,60 C -45,45 -15,25 5,-15 C -25,-5 -60,-25 -75,-60 C -105,-20 -95,25 -80,60 Z" fill="#f2a104"/>
    </g>
</svg>
